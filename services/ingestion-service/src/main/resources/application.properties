spring.application.name=ingestion-service
server.port=8081
spring.web.error.include-stacktrace=never

openelo.ingestion.football-data.base-url=https://api.football-data.org/v4
# Free token from https://www.football-data.org/client/register, read from the environment so it stays out of the repo.
openelo.ingestion.football-data.token=${FOOTBALL_DATA_TOKEN:}
