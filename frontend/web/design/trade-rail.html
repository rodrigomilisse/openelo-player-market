<title>OpenElo Price Rail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="design.css">
<style>
/* Layout: a tall price rail on the left where you drag to your price over the book's depth; the week in 3D in the middle; readings and a hold-to-confirm button on the right */
html, body { height: 100% }
.floor { position: relative; z-index: 2; min-height: 100%; display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(280px, 340px); gap: 24px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 20px 24px; text-shadow: 0 2px 16px rgba(6,11,20,0.9) }

.rail-wrap { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; min-height: 560px }
.rail-wrap .cap { color: var(--muted); font-size: 14px }
.rail { position: relative; margin-left: 70px }
.rail .line { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: linear-gradient(var(--ask), var(--glass-edge) 40%, var(--glass-edge) 60%, var(--price)) }
.rail .tick { position: absolute; left: 6px; height: 6px; margin-top: -3px; border-radius: 3px }
.rail .mark { position: absolute; right: calc(100% + 10px); margin-top: -10px; font-size: 14px; white-space: nowrap; text-align: right }
.rail .mint-line { position: absolute; left: -70px; right: 0; border-top: 1px dashed var(--ask) }
.rail input[type="range"] { position: absolute; left: -12px; top: 0; bottom: 0; width: 26px; height: 100%; margin: 0; writing-mode: vertical-lr; direction: rtl; appearance: none; background: transparent; cursor: ns-resize }
.rail input[type="range"]::-webkit-slider-thumb { appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 6px rgba(228,236,245,0.18), 0 0 24px var(--ink) }
.rail input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 6px rgba(228,236,245,0.18), 0 0 24px var(--ink) }
.rail .handle-label { position: absolute; left: 34px; margin-top: -22px; font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; pointer-events: none; white-space: nowrap }

.middle { display: flex; flex-direction: column; justify-content: space-between; min-width: 0 }
.middle h1 { font-size: clamp(52px, 6vw, 92px) }
.middle .club { color: var(--muted); font-size: 17px }
.status { font-size: 22px; max-width: 34ch; line-height: 1.3 }
.status b { font-weight: 700 }

.right { display: flex; flex-direction: column; gap: 28px; align-items: stretch }
.sides { display: flex; gap: 28px }
.sides button { background: none; border: 0; color: var(--muted); font-family: var(--display); font-weight: 900; font-size: 44px; padding: 0 0 4px; cursor: pointer; border-bottom: 3px solid transparent }
.sides button[aria-pressed="true"].buy { color: var(--price); border-bottom-color: var(--price); text-shadow: 0 0 20px var(--price) }
.sides button[aria-pressed="true"].sell { color: var(--ask); border-bottom-color: var(--ask); text-shadow: 0 0 20px var(--ask) }
.amounts { display: flex; flex-wrap: wrap; gap: 8px }
.amounts button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--glass-edge); background: rgba(6,11,20,0.5); color: var(--ink); font: inherit; font-weight: 700; font-size: 18px; cursor: pointer }
.amounts button[aria-pressed="true"] { background: var(--ink); color: var(--night) }
.readings { display: grid; gap: 14px }
.reading { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--glass-edge); padding-bottom: 8px }
.reading b { font-family: var(--display); font-weight: 800; font-size: 30px }
.hold { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; background: rgba(6,11,20,0.6); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 22px; cursor: pointer; align-self: center; touch-action: none }
.hold svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.hold .label { position: relative; line-height: 1.05 }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin: -14px 0 0 }
@media (max-width: 960px) {
  .floor { grid-template-columns: minmax(0, 1fr) }
  .rail-wrap { min-height: 420px }
}
</style>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="floor">
  <div class="rail-wrap">
    <div class="cap">Drag to your price</div>
    <div class="rail" id="rail">
      <div class="line"></div>
      <div id="ticks"></div>
      <input type="range" id="price" min="325" max="365" step="1" value="345" aria-label="Limit price">
      <div class="handle-label" id="handle-label"></div>
    </div>
    <div class="cap"><span style="color: var(--ask)">Orange</span>: shares for sale. <span style="color: var(--price)">Blue</span>: shares wanted.</div>
  </div>

  <div class="middle">
    <div>
      <div class="club">Vale do Sado FC, central midfield</div>
      <h1>Mendonça</h1>
      <div class="legend" style="margin-top: 10px"><span><i class="swatch price"></i>Price</span><span><i class="swatch elo"></i>OpenElo</span><span><i class="swatch mint"></i>New shares</span><span>Thin lines: trend</span></div>
    </div>
    <p class="status" id="status" role="status"></p>
  </div>

  <div class="right">
    <div class="sides" role="group" aria-label="Side">
      <button type="button" class="buy" id="buy" aria-pressed="true">Buy</button>
      <button type="button" class="sell" id="sell" aria-pressed="false">Sell</button>
    </div>
    <div>
      <div class="muted" style="margin-bottom: 8px">Shares</div>
      <div class="amounts" id="amounts" role="group" aria-label="Shares">
        <button type="button" aria-pressed="false">10</button>
        <button type="button" aria-pressed="false">25</button>
        <button type="button" aria-pressed="true">40</button>
        <button type="button" aria-pressed="false">100</button>
      </div>
    </div>
    <div class="readings">
      <div class="reading"><span class="muted" id="total-label">You hold until filled</span><b id="total"></b></div>
      <div class="reading"><span class="muted">Price trend this week</span><b id="price-trend" style="color: var(--price)"></b></div>
      <div class="reading"><span class="muted">Rating trend this week</span><b id="elo-trend" style="color: var(--elo)"></b></div>
    </div>
    <button type="button" class="hold" id="hold" aria-describedby="hold-hint">
      <svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="62" fill="none" stroke="rgba(150,190,235,0.2)" stroke-width="4"></circle><circle id="ring" cx="66" cy="66" r="62" fill="none" stroke="var(--price)" stroke-width="4" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6"></circle></svg>
      <span class="label" id="hold-label">Hold<br>to buy</span>
    </button>
    <p class="hint" id="hold-hint">Press and hold, or hold Space, to confirm</p>
  </div>
</div>

<script type="module">
import { week, book, MINT_PRICE } from './sample-data.js';
import { quote, formatCredits, bookOutcome } from './ticket.js';
import { buildTradeScene, STEPS_PER_DAY } from './trade-scene.js';
import { fitTrend } from './analysis.js';

const field = (id) => document.getElementById(id);
const LOW = 325;
const HIGH = 365;
const MINT = Math.round(MINT_PRICE * 100);
const topOf = (hundredths) => `${(HIGH - hundredths) / (HIGH - LOW) * 100}%`;
const show = (hundredths) => (hundredths / 100).toFixed(2);
const depthTick = ([price, shares], color) =>
  `<div class="tick" style="top: ${topOf(Math.round(Number(price) * 100))}; width: ${shares / 2.2}px; background: ${color}; box-shadow: 0 0 12px ${color}"></div>`;

field('ticks').innerHTML =
  book.asks.map((level) => depthTick(level, 'var(--ask)')).join('') +
  book.bids.map((level) => depthTick(level, 'var(--price)')).join('') +
  `<div class="mint-line" style="top: ${topOf(MINT)}"></div><div class="mark" style="top: ${topOf(MINT)}; color: var(--ask)">new 3.61</div>` +
  `<div class="mark" style="top: ${topOf(342)}">last 3.42</div>`;

let side = 'buy';
let shares = 40;

function describe(price) {
  const outcome = bookOutcome(side, price);
  if (outcome.kind === 'mint') return `At ${show(price)} or more, <b>new shares at 3.61</b> cost the same or less. Mint instead.`;
  if (side === 'buy') {
    if (outcome.kind === 'fills') return `<b style="color: var(--price)">Fills now.</b> ${outcome.shares} shares are for sale at ${show(price)} or less.`;
    return `<b>Waits in the book.</b> ${outcome.shares ? `${outcome.shares} shares are wanted at your price or higher, ahead of you.` : 'You would be the best bid.'} Sellers start at ${show(outcome.best)}.`;
  }
  if (outcome.kind === 'fills') return `<b style="color: var(--ask)">Fills now.</b> Buyers want ${outcome.shares} shares at ${show(price)} or more.`;
  return `<b>Waits in the book.</b> ${outcome.shares ? `${outcome.shares} shares are for sale at your price or lower, ahead of you.` : 'You would be the cheapest seller.'} Buyers stop at ${show(outcome.best)}.`;
}

function update() {
  const price = Number(field('price').value);
  field('handle-label').style.top = topOf(price);
  field('handle-label').textContent = show(price);
  field('handle-label').style.color = side === 'buy' ? 'var(--price)' : 'var(--ask)';
  field('status').innerHTML = describe(price);
  const { cost, fee } = quote(shares, price);
  field('total').textContent = formatCredits(side === 'buy' ? cost + fee : cost - fee);
  field('total-label').textContent = side === 'buy' ? 'You hold until filled' : 'You receive when filled';
  field('ring').setAttribute('stroke', side === 'buy' ? 'var(--price)' : 'var(--ask)');
  field('hold-label').innerHTML = `Hold<br>to ${side}`;
}

function setSide(next) {
  side = next;
  field('buy').setAttribute('aria-pressed', String(next === 'buy'));
  field('sell').setAttribute('aria-pressed', String(next === 'sell'));
  update();
}
field('buy').addEventListener('click', () => setSide('buy'));
field('sell').addEventListener('click', () => setSide('sell'));
field('price').addEventListener('input', update);
field('amounts').addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  shares = Number(button.textContent);
  field('amounts').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
  update();
});

const HOLD_MS = 900;
const CIRCUMFERENCE = 389.6;
let holdStart = 0;
let holding = false;
function tick(now) {
  if (!holding) return;
  const done = Math.min((now - holdStart) / HOLD_MS, 1);
  field('ring').setAttribute('stroke-dashoffset', String(CIRCUMFERENCE * (1 - done)));
  if (done === 1) {
    holding = false;
    field('status').innerHTML = `<b>Demo only:</b> a ${side} order for ${shares} at ${show(Number(field('price').value))} would be placed now. Nothing was sent.`;
    return;
  }
  requestAnimationFrame(tick);
}
function startHold() {
  if (holding) return;
  holding = true;
  holdStart = performance.now();
  requestAnimationFrame(tick);
}
function stopHold() {
  holding = false;
  field('ring').setAttribute('stroke-dashoffset', String(CIRCUMFERENCE));
}
field('hold').addEventListener('pointerdown', startHold);
['pointerup', 'pointerleave', 'pointercancel'].forEach((type) => field('hold').addEventListener(type, stopHold));
field('hold').addEventListener('keydown', (event) => { if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); startHold(); } });
field('hold').addEventListener('keyup', (event) => { if (event.key === ' ' || event.key === 'Enter') stopHold(); });

const perDay = (values) => fitTrend(values).slope * STEPS_PER_DAY;
const priceTrend = perDay(week.price);
const eloTrend = perDay(week.elo);
field('price-trend').textContent = `${priceTrend >= 0 ? '+' : '−'}${Math.abs(priceTrend).toFixed(3)} a day`;
field('elo-trend').textContent = `${eloTrend >= 0 ? '+' : '−'}${Math.abs(eloTrend).toFixed(1)} a day`;
update();

await buildTradeScene(document.getElementById('scene'), { shiftRight: 0.02, distance: 31 });
</script>
