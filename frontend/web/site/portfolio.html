<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | OpenElo</title>
<meta name="description" content="Your players, what they are worth, and what they will pay next. Play-money preview.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  .payout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px 32px; align-items: center }
  .payout h2 { font-size: 26px }
  .payout .big { font-family: var(--display); font-weight: 900; font-size: clamp(54px, 7vw, 96px); line-height: 0.9; color: var(--elo); font-variant-numeric: tabular-nums }
  .payout .big small { font-family: var(--ui); font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 8px }
  .payout p { margin: 8px 0 0; color: var(--muted) }
  .payout .clock { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--ink); font-variant-numeric: tabular-nums }
  .payout .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px }
  .paid { min-height: 1.4em; color: var(--elo); font-weight: 600 }
  td small { display: block; color: var(--muted) }
  @media (max-width: 760px) { .payout { grid-template-columns: 1fr } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body class="mode-market">
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="page">
  <header data-shell="header"></header>
  <main>
    <section class="mhead" aria-labelledby="pf-title">
      <div>
        <h1 id="pf-title">Your portfolio</h1>
        <p class="preview-note"><strong>Play money.</strong> 1,000 practice credits kept in this browser. Prices, payouts and fees are illustrative.</p>
      </div>
      <dl class="kpis liquid" data-field="kpis"></dl>
    </section>

    <section class="glass-panel payout" aria-labelledby="next-title">
      <div>
        <h2 id="next-title">Next payout</h2>
        <div class="big" data-field="next"></div>
        <p data-field="next-note"></p>
      </div>
      <div>
        <p>Paid in <span class="clock" data-field="clock"></span></p>
        <p data-field="share"></p>
        <div class="actions">
          <button class="button button-gold" type="button" data-field="simulate">Simulate the next payout</button>
          <a class="button" href="dividends.html">How it's worked out</a>
        </div>
        <p class="paid" role="status" data-field="paid"></p>
      </div>
    </section>

    <section class="glass-panel" aria-labelledby="pos-title">
      <div class="section-head"><h2 id="pos-title">Your players</h2><a class="button" href="market.html">Find players</a></div>
      <div data-field="positions"></div>
    </section>
  </main>
  <div data-shell="footer"></div>
</div>
<script type="module">
  import { shell, field, escape, number } from './site.js';
  import { getPool, simulatePayout } from './api.js';
  import { boxScene, portfolio, cr, signedCr, tone, tradeUrl, countdown } from './market-ui.js';
  shell();
  const pool = await getPool();
  countdown(field('clock'), pool.nextPayoutAt);
  const draw = async () => {
    boxScene();
    const { w, rows, proj, value, cost, gain } = await portfolio();
    const total = w.credits + value;
    field('kpis').innerHTML = [[cr(total), 'Total, credits and shares'], [cr(w.credits), 'Credits to spend'], [cr(value), 'Shares worth'],
      [`<span class="${tone(gain)}">${signedCr(gain)}</span>`, 'Price gain on shares'], [`<span class="gold">${cr(w.dividends)}</span>`, 'Dividends received']]
      .map(([v, l]) => `<div><dt>${l}</dt><dd>${v}</dd></div>`).join('');
    field('next').innerHTML = rows.length ? `${cr(proj.next)}<small>credits</small>` : `0.00<small>credits</small>`;
    field('next-note').textContent = rows.length
      ? `If ratings stay as they are until the payout. One typical match each could make it anywhere from ${cr(proj.low)} to ${cr(proj.high)}.`
      : 'Back a player and his shares start earning from the next payout.';
    field('share').textContent = rows.length ? `You hold ${(proj.weightShare * 100).toFixed(3)}% of all the rating weight in the market, so you get that much of today's ${cr(pool.payoutToday)} credit payout.` : '';
    field('simulate').disabled = !rows.length;
    field('positions').innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr><th scope="col">Player</th><th class="num" scope="col">Shares</th>
      <th class="num" scope="col">Paid</th><th class="num" scope="col">Price now</th><th class="num" scope="col">Worth</th><th class="num" scope="col">Gain</th>
      <th class="num" scope="col">Dividends so far</th><th class="num" scope="col">Next payout</th></tr></thead><tbody>${rows.map((r) => `<tr>
      <td><a href="${tradeUrl(r.id)}">${escape(r.p.name)}</a><small>${escape(r.p.club)} · ${number.format(r.p.rating)}</small></td>
      <td class="num">${number.format(r.shares)}</td><td class="num muted">${r.cost ? cr(r.cost / r.shares) : '–'}</td><td class="num">${cr(r.p.price)}</td>
      <td class="num money">${cr(r.value)}</td><td class="num ${tone(r.gain)}">${r.cost ? signedCr(r.gain) : '–'}</td>
      <td class="num gold">${cr(r.dividends || 0)}</td><td class="num gold">${cr(r.proj?.next || 0)}</td></tr>`).join('')}</tbody></table></div>`
      : `<p class="empty">The pitch below is empty: you don't hold anyone yet. <a href="market.html">Browse players</a> and back your first one.</p>`;
  };
  await draw();
  field('simulate').addEventListener('click', async () => {
    const { paid, rows } = simulatePayout();
    field('paid').textContent = paid ? `Paid ${cr(paid)} credits across ${rows.length} player${rows.length === 1 ? '' : 's'}. (Preview: the real payout runs once a day.)` : '';
    await draw();
  });
  document.querySelector('main').addEventListener('pageshow-again', draw);
</script>
</body>
</html>
