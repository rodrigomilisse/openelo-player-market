<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Theme before first paint: the reader's choice, else the system's. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('site-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch{document.documentElement.dataset.theme='dark'}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starter: immersive page</title>
<meta name="description" content="Replace with one plain sentence about the page.">
<meta property="og:title" content="Starter: immersive page">
<!-- Before launch: og:image (1200×630) with twitter:card summary_large_image, and a favicon. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Replace with the project's own pair, chosen for its subject (see the frontend-design skill). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,900&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="site.css">
<!-- Pin an exact version; every page carries the same map. -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="page">
  <header class="site-header liquid">
    <a class="logo" href="index.html">Name</a>
    <nav aria-label="Main"><a href="index.html" aria-current="page">Home</a><a href="#about">About</a></nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme"></button>
  </header>
  <main>
    <section class="hero">
      <h1>The one big idea</h1>
      <p class="lede">One or two plain sentences that say what this is and who it is for.</p>
    </section>
    <section class="stage" aria-hidden="true"></section>
    <section class="glass-panel" id="about">
      <h2>A section on glass</h2>
      <p>All interface sits on glass panels above the scene. The scene itself carries the motion.</p>
    </section>
    <section class="stage" aria-hidden="true"></section>
  </main>
</div>
<script type="module" src="site.js"></script>
<script type="module" src="scene.js"></script>
</body>
</html>
